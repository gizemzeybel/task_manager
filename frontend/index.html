<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager 💜</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="bg"></div>

    <main class="container">
      <header class="top">
        <h1>Task Manager</h1>
        <p class="subtitle">Plan • Track • Complete 💜</p>
      </header>

      <!-- AUTH -->
      <section class="card auth-card" id="authCard">
        <h2 id="authTitle">Login</h2>

        <div class="tabs">
          <button class="tab active" id="loginTab">Login</button>
          <button class="tab" id="registerTab">Register</button>
        </div>

        <form id="authForm">
          <div class="field" id="nameField" style="display: none">
            <label>Name</label>
            <input type="text" id="name" placeholder="Başak" />
          </div>

          <div class="field">
            <label>Email</label>
            <input type="email" id="email" placeholder="mail@example.com" />
          </div>

          <div class="field">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••" />
          </div>

          <button class="btn primary" type="submit" id="authBtn">
            Login
          </button>

          <p class="msg" id="authMsg"></p>
        </form>
      </section>

      <!-- APP -->
      <section class="card app-card hidden" id="appCard">
        <div class="app-header">
          <div>
            <h2 id="welcome">Welcome 💜</h2>
            <p class="small" id="userEmail"></p>
          </div>
          <button class="btn ghost" id="logoutBtn">Logout</button>
        </div>

        <div class="task-create">
          <input id="taskTitle" placeholder="Task title..." />
          <input id="taskDesc" placeholder="Description..." />
          <input id="taskDate" type="date" />
          <select id="taskStatus">
            <option value="todo">To Do</option>
            <option value="inprogress">In Progress</option>
            <option value="done">Done</option>
          </select>
          <button class="btn primary" id="addTaskBtn">Add</button>
        </div>

        <div class="filters">
          <button class="filter active" data-status="all">All</button>
          <button class="filter" data-status="todo">To Do</button>
          <button class="filter" data-status="inprogress">In Progress</button>
          <button class="filter" data-status="done">Done</button>
        </div>

        <div class="task-list" id="taskList"></div>

        <p class="msg" id="taskMsg"></p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
